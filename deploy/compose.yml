name: ems

x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/backend.Dockerfile
  environment: &environment
    EMS_DEBUG: "0"
    EMS_SECRET_KEY: ${EMS_SECRET_KEY:?Set a random EMS_SECRET_KEY in deploy/.env}
    EMS_DB_PATH: /data/events.sqlite3
    EMS_ALLOWED_HOSTS: ${EMS_ALLOWED_HOSTS:?Set the public hostname}
    EMS_CSRF_TRUSTED_ORIGINS: ${EMS_CSRF_TRUSTED_ORIGINS:?Set the HTTPS origin}
    EMS_TRUST_PROXY: "1"
  volumes:
    - database:/data
  networks: [private]
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]

services:
  migrate:
    <<: *backend
    command: ["python", "backend/manage.py", "migrate", "--noinput"]
    restart: "no"
  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/health', headers={'Host':'${EMS_PUBLIC_HOST:?Set the public hostname}', 'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
  gateway:
    build:
      context: ..
      dockerfile: deploy/gateway.Dockerfile
    environment:
      DJANGO_UPSTREAM: http://backend:8000
      EMS_PUBLIC_HOST: ${EMS_PUBLIC_HOST:?Set the public hostname}
    depends_on:
      backend:
        condition: service_healthy
    networks: [private]
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    environment:
      EMS_SITE_ADDRESS: ${EMS_SITE_ADDRESS:?Set a DNS name or localhost}
    ports:
      - "${EMS_HTTP_PORT:-80}:80"
      - "${EMS_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy
    networks: [private, edge]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  backups:
    <<: *backend
    environment:
      <<: *environment
      EMS_BACKUP_DIR: /backups
    volumes:
      - database:/data:ro
      - backups:/backups
    command: ["python", "scripts/db_backup.py", "run"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "scripts/db_backup.py", "status"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 2

networks:
  private:
    internal: true
  edge: {}
volumes:
  database: {}
  backups: {}
  caddy_data: {}
  caddy_config: {}
